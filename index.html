<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Light Upon Light | Advocacy, Accessibility, Education &amp; Equality</title>
  <meta
    name="description"
    content="Light Upon Light is a 501(c)(3) nonprofit creating a future where differently-abled people are valued, included, and given the same opportunities as everyone else."
  />
  <meta name="theme-color" content="#7107E7" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=8" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=8" />
  <link rel="canonical" href="https://thelightuponlight.org/" />
  <link rel="describedby" href="/llms.txt" />
  <link rel="alternate" type="text/markdown" title="Markdown" href="/index.md" />
  <link rel="llms.txt" href="/llms.txt" />
  <link
    rel="preload"
    as="image"
    href="/hero-mobile.webp?v=2"
    type="image/webp"
    media="(max-width: 767px)"
    fetchpriority="high"
  />
  <link
    rel="preload"
    as="image"
    href="/hero-desktop.webp?v=2"
    type="image/webp"
    media="(min-width: 768px)"
    fetchpriority="high"
  />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Light Upon Light" />
  <meta
    property="og:description"
    content="A nonprofit movement for advocacy, accessibility, education, and equality for differently-abled people."
  />
  <meta property="og:url" content="https://thelightuponlight.org/" />
  <meta property="og:image" content="https://thelightuponlight.org/icon-512.png" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:image" content="https://thelightuponlight.org/icon-512.png" />
  <style>
    html, body { margin: 0; background: #ffffff; }
    #boot-hero {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background: #1a1030;
    }
    #boot-hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 40%;
    }
    #boot-hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, rgba(0,0,0,0.42) 0%, rgba(0,0,0,0.22) 52%, rgba(0,0,0,0.06) 78%, transparent 100%);
      width: 58%;
    }
    #root { position: relative; z-index: 1; min-height: 100dvh; background: #ffffff; }
  </style>
</head>

<body>
  <div id="boot-hero" aria-hidden="true">
    <picture>
      <source media="(min-width: 768px)" srcset="/hero-desktop.webp?v=2" type="image/webp" />
      <img
        src="/hero-mobile.webp?v=2"
        alt=""
        width="1200"
        height="756"
        fetchpriority="high"
        decoding="async"
      />
    </picture>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
