<!--
  Optional second template for internal team notifications.

  Template settings:
  - Template name: Donation Notification
  - Template ID: donation_notification (optional)
  - To Email: {{to_email}}
  - From Name: {{from_name}}
  - Reply To: {{reply_to}}
  - Subject: {{subject}}
-->
<div style="font-family: Arial, Helvetica, sans-serif; background: #f8fafc; padding: 24px 16px;">
  <div style="max-width: 560px; margin: 0 auto; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 24px;">
    <h1 style="margin: 0 0 12px; font-size: 22px; color: #0f172a;">New donation received</h1>
    <p style="margin: 0 0 16px; font-size: 15px; line-height: 1.6; color: #475569;">
      A donor just completed a PayPal gift through the website.
    </p>
    <table style="width: 100%; border-collapse: collapse; font-size: 14px; color: #334155;">
      <tr>
        <td style="padding: 8px 0; border-bottom: 1px solid #e2e8f0; width: 140px;"><strong>Donor</strong></td>
        <td style="padding: 8px 0; border-bottom: 1px solid #e2e8f0;">{{to_name}}</td>
      </tr>
      <tr>
        <td style="padding: 8px 0; border-bottom: 1px solid #e2e8f0;"><strong>Email</strong></td>
        <td style="padding: 8px 0; border-bottom: 1px solid #e2e8f0;">{{donor_email}}</td>
      </tr>
      <tr>
        <td style="padding: 8px 0; border-bottom: 1px solid #e2e8f0;"><strong>Amount</strong></td>
        <td style="padding: 8px 0; border-bottom: 1px solid #e2e8f0;">{{amount}}</td>
      </tr>
      <tr>
        <td style="padding: 8px 0; border-bottom: 1px solid #e2e8f0;"><strong>Frequency</strong></td>
        <td style="padding: 8px 0; border-bottom: 1px solid #e2e8f0;">{{frequency}}</td>
      </tr>
      <tr>
        <td style="padding: 8px 0;"><strong>Transaction ID</strong></td>
        <td style="padding: 8px 0;">{{transaction_id}}</td>
      </tr>
    </table>
  </div>
</div>
