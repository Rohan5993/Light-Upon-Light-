<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Light Upon Light">
  <defs>
    <linearGradient id="disc" x1="6" y1="2" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C392FF"/>
      <stop offset="38%" stop-color="#8B3DFF"/>
      <stop offset="100%" stop-color="#6109D4"/>
    </linearGradient>
    <linearGradient id="sun" x1="18" y1="14" x2="48" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF4CC"/>
      <stop offset="42%" stop-color="#F7D056"/>
      <stop offset="100%" stop-color="#E8A010"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed tile — no black / empty corners -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#disc)"/>

  <!-- Inner highlight edge -->
  <rect x="1.25" y="1.25" width="61.5" height="61.5" rx="12.75" ry="12.75" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.25"/>

  <!-- Premium sun -->
  <g fill="url(#sun)">
    <circle cx="32" cy="32" r="11.25"/>
    <rect x="30.05" y="7.2" width="3.9" height="10.2" rx="1.95"/>
    <rect x="30.05" y="46.6" width="3.9" height="10.2" rx="1.95"/>
    <rect x="7.2" y="30.05" width="10.2" height="3.9" rx="1.95"/>
    <rect x="46.6" y="30.05" width="10.2" height="3.9" rx="1.95"/>
    <g transform="rotate(45 32 32)">
      <rect x="30.05" y="7.2" width="3.9" height="10.2" rx="1.95"/>
      <rect x="30.05" y="46.6" width="3.9" height="10.2" rx="1.95"/>
      <rect x="7.2" y="30.05" width="10.2" height="3.9" rx="1.95"/>
      <rect x="46.6" y="30.05" width="10.2" height="3.9" rx="1.95"/>
    </g>
  </g>

  <circle cx="23" cy="20.5" r="8.5" fill="#FFFFFF" fill-opacity="0.15"/>
</svg>
